services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build arguments for Next.js public environment variables
        # Override these in .env file or via command line
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
        NEXT_PUBLIC_ENABLE_AUTH_LOGS: ${NEXT_PUBLIC_ENABLE_AUTH_LOGS:-false}

    image: leopay-frontend:latest

    container_name: leopay-frontend

    ports:
      - '3000:3000'

    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - HOSTNAME=${HOSTNAME:-0.0.0.0}

    # Health check configuration
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Restart policy for production reliability
    restart: unless-stopped

    # Optional: Add networks if connecting to other services
    # networks:
    #   - app-network
# Optional: Define networks for service communication
# networks:
#   app-network:
#     driver: bridge
